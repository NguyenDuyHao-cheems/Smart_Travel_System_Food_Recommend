services:
  core_backend:
    build: 
      context: ./core_backend
      dockerfile: Dockerfile
    container_name: core_backend
    ports:
      - "8000:8000"
    env_file:
      - ./core_backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ai_engine:
    build: 
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: ai_engine
    ports:
      - "8001:8001"
    env_file:
      - ./ai_engine/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
